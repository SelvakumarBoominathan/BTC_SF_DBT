version: 2

models:
  - name: stg_btc
    columns:
      - name: HASH_KEY
        tests:
          - not_null
          - unique
  - name: whale_alert
    config:
      contract:
        enforced: true
    columns:
      - name: TX_COUNT
        data_type: integer
      - name: TOTAL_SENT
        data_type: float
      - name: PRICE
        data_type: float
      - name: output_address
        data_type: string
        tests:
          - assert_valid_btc_address
